name: build

# Собирает бинарник под все три ОС сразу (PyInstaller не кросс-компилирует —
# поэтому матрица из трёх раннеров, а не один джоб). Готовые архивы появляются
# в разделе Actions -> этот run -> Artifacts, хранятся 90 дней.
#
# Запуск: вручную (кнопка "Run workflow" на вкладке Actions) или по тегу v*.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # нужно job'у release ниже, чтобы создать GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: YandexDLDesktop-windows
            vendor_dir: win32
            ff_name: ffmpeg.exe
          - os: macos-latest
            artifact: YandexDLDesktop-macos
            vendor_dir: darwin
            ff_name: ffmpeg
          - os: ubuntu-latest
            artifact: YandexDLDesktop-linux
            vendor_dir: linux
            ff_name: ffmpeg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Linux: PySide6/QtWebEngine тянут системные библиотеки, которых нет на
      # голом ubuntu-latest раннере.
      - name: Системные зависимости (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libgbm1

      # Статический ffmpeg под КАЖДУЮ из трёх ОС (johnvansickle/gyan.dev/evermeet.cx —
      # ровно те источники, что были бы и при ручной сборке), чтобы ПОЛОЖИТЬ его
      # в vendor/ffmpeg/<os>/ и yandexdl.spec забандлил его в сборку. Без этого шага
      # итоговый exe/app/бинарник работал бы, но конвертация видео падала бы у
      # любого пользователя без своего ffmpeg в PATH.
      
      - name: Скачать статический ffmpeg (Windows/Linux)
        id: ffmpeg
        if: runner.os != 'macOS'
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Положить ffmpeg в vendor/ (чтобы попал в сборку)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p "vendor/ffmpeg/${{ matrix.vendor_dir }}"
          cp "${{ steps.ffmpeg.outputs.ffmpeg-path }}/${{ matrix.ff_name }}" \
             "vendor/ffmpeg/${{ matrix.vendor_dir }}/${{ matrix.ff_name }}"

      - name: Python-зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Сборка (PyInstaller)
        run: pyinstaller yandexdl.spec

      - name: Запаковать dist (Linux/Windows)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cd dist
          7z a -r "../${{ matrix.artifact }}.zip" "YandexDLDesktop" || zip -r "../${{ matrix.artifact }}.zip" "YandexDLDesktop"

      - name: Запаковать .app (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "YandexDLDesktop.app" "../${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          retention-days: 90

  # Только по тегу (v1.0.0 и т.п.) — собирает три zip'а из job'а build выше и
  # публикует их в GitHub Release с этим тегом (релиз создаётся, если его ещё
  # нет). По ручному запуску (workflow_dispatch) релиз не создаётся — только
  # артефакты в Actions, см. job build.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          draft: false
          generate_release_notes: true
